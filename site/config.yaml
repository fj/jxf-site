baseURL: "https://jxf-dot-me.netlify.app/"
locale: "en-us"
title: "{ jxf }"

theme: "hugo-coder"

taxonomies:
  tag: "tags"
  category: "categories"
  author: "authors"
  series: "series"

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["$$", "$$"]
            - ["\\[", "\\]"]
          inline:
            - ["$", "$"]
            - ["\\(", "\\)"]

params:
  # Where binary assets (images, etc.) are served from in a remote/production
  # build. The local `site/assets/` tree is mirrored to this bucket via
  # `task assets:sync:up:hard`. In development (`hugo server`) assets are served
  # from disk instead — see layouts/partials/asset.html.
  assets:
    remoteBaseURL: "https://storage.googleapis.com/site-assets.jxf.me"
  customJS:
    - "js/sidenotes.js"
  customizations:
    styles:
      - "styles/base.scss"
  author: "John Feminella"
  authorData:
    name: "John Feminella"
    tagline: "software engineer · enthusiastic technologist · curiosity advocate"
    avatar:
      url: "https://s3.amazonaws.com/assets.jxf.me/images/jf.jpeg"
  social:
    - name: Bluesky
      url: https://bsky.app/profile/jxf.me
      icon: bluesky
      rel: me
      target: _blank
      weight: 1
    - name: GitHub
      url: https://github.com/fj
      icon: github
      rel: me
      target: _blank
      weight: 2
    - name: Mastodon
      url: https://mastodon.social/@jxf@mastodon.social/
      icon: mastodon
      rel: me
      target: _blank
      weight: 3
    - name: Twitter
      url: https://twitter.com/jxxf
      icon: twitter
      rel: me
      target: _blank
      weight: 4
    - name: LinkedIn
      url: https://www.linkedin.com/in/johnxf
      icon: linkedin
      rel: me
      target: _blank
      weight: 5
    - name: StackOverflow
      url: https://stackoverflow.com/users/75170/john-feminella
      icon: stackoverflow
      target: _blank
      weight: 6
    - name: Connect
      url: /self.html#connect
      icon: mail
      rel: me
      target: _blank
      weight: 6

languages:
  en:
    menu:
      main:
        - name: "Blog"
          weight: "1"
          url: "posts/"
        - name: "Work"
          weight: "2"
          url: "projects/"
        - name: "Meta"
          weight: "3"
          url: "meta/"
        - name: "Self"
          weight: "4"
          url: "about/"
