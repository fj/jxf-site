{{ $avatar := .Site.Params.authorData.avatar.path }}

{{ if and ($avatar) (not (isset .Site.Params "gravatar")) }}
  <div class="avatar"><img src="{{ partial "asset.html" $avatar }}" alt="avatar"></div>
{{ end }}
{{ with .Site.Params.gravatar }}
  <div class="avatar"><img src="https://www.gravatar.com/avatar/{{md5 .}}?s=240&d=mp" alt="gravatar"></div>
{{ end }}
