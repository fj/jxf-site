baseURL: "https://jxf-dot-me.netlify.app/"
locale: "en-us"
title: "{ jxf }"

theme: "hugo-coder"

taxonomies:
  tag: "tags"
  category: "categories"
  author: "authors"
  series: "series"

markup:
  goldmark:
    parser:
      # Allow Markdown attributes (e.g. {.half-width}) on block elements, and
      # emit standalone images directly so the image render hook can wrap them
      # in a <figure> instead of a <p>.
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["$$", "$$"]
            - ["\\[", "\\]"]
          inline:
            - ["$", "$"]
            - ["\\(", "\\)"]
