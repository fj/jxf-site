# https://taskfile.dev

version: "3"

vars:
  PROJECT_ROOT:
    sh: "echo -n $PWD"
  SOURCE_PATH: "{{.PROJECT_ROOT}}/site"
  CONFIG_PATH: "{{.PROJECT_ROOT}}/site"
  CONTENT_PATH: "{{.PROJECT_ROOT}}/site/content"
  OUTPUT_PATH: "{{.PROJECT_ROOT}}/out"
  RESOURCES_PATH: "{{.SOURCE_PATH}}/resources"
  ASSETS_LOCAL_PATH: "{{.PROJECT_ROOT}}/site/assets"
  ASSETS_REMOTE_PATH: "gs://site-assets.jxf.me"
  # The only subtrees of site/assets that belong in the bucket: the gitignored
  # binaries that `asset.html` resolves against params.assets.remoteBaseURL in
  # production. Everything else under assets/ (js/, scss/, styles/, experiments/)
  # is source in version control that Hugo Pipes compiles, fingerprints, and
  # publishes into the build output, so the bucket never serves it. Keep this
  # list in agreement with the corresponding block in .gitignore.
  ASSETS_REMOTE_DIRS: "fonts images posts projects"

tasks:


  clean:
    desc: "remove temporary paths"
    cmds:
      - rm -rf {{.OUTPUT_PATH}}
      - rm -rf {{.RESOURCES_PATH}}

  "assets:fonts:download*":
    desc: "download self-hosted webfonts (use :hard to force re-download)"
    vars:
      q: "{{index .MATCH 0}}"
      FONTS_PATH: "{{.ASSETS_LOCAL_PATH}}/fonts"
    status:
      - test "{{.q}}" != ":hard"
      - test -f {{.FONTS_PATH}}/FantasqueSansMono-Regular.woff2
      - test -f {{.FONTS_PATH}}/FantasqueSansMono-Italic.woff2
      - test -f {{.FONTS_PATH}}/FantasqueSansMono-Bold.woff2
      - test -f {{.FONTS_PATH}}/FantasqueSansMono-BoldItalic.woff2
    cmds:
      - mkdir -p {{.FONTS_PATH}}
      - |-
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl --location --fail --silent \
          "https://github.com/belluzj/fantasque-sans/releases/latest/download/FantasqueSansMono-Normal.tar.gz" \
          | tar -xz -C "$tmp"
        cp "$tmp"/Webfonts/FantasqueSansMono-Regular.woff2 \
           "$tmp"/Webfonts/FantasqueSansMono-Italic.woff2 \
           "$tmp"/Webfonts/FantasqueSansMono-Bold.woff2 \
           "$tmp"/Webfonts/FantasqueSansMono-BoldItalic.woff2 \
           {{.FONTS_PATH}}/
        cp "$tmp"/LICENSE.txt {{.FONTS_PATH}}/FantasqueSansMono-LICENSE.txt

  # ASSETS_REMOTE_DIRS and the .gitignore block naming the same trees are two
  # hand-maintained lists, and `assets:sync:prune:hard` deletes bucket prefixes
  # based on the first one — so rather than trust a comment to keep them aligned,
  # derive the truth from git and fail on drift in either direction. A gitignored
  # tree missing from the list would silently never reach the bucket (production
  # 404s, and prune would delete it if it got there another way); a listed tree
  # that isn't gitignored is version-controlled source the sync would publish.
  "assets:sync:_check":
    internal: true
    cmds:
      - |-
        drift=""
        for dir in {{.ASSETS_REMOTE_DIRS}}; do
          if ! git -C "{{.PROJECT_ROOT}}" check-ignore -q "{{.ASSETS_LOCAL_PATH}}/$dir"; then
            drift="$drift\n    $dir: in ASSETS_REMOTE_DIRS but not gitignored (syncing it would publish version-controlled source)"
          fi
        done
        for path in {{.ASSETS_LOCAL_PATH}}/*/; do
          dir="$(basename "$path")"
          git -C "{{.PROJECT_ROOT}}" check-ignore -q "$path" || continue
          case " {{.ASSETS_REMOTE_DIRS}} " in
            *" $dir "*) continue ;;
          esac
          drift="$drift\n    $dir: gitignored but not in ASSETS_REMOTE_DIRS (it will never reach the bucket)"
        done
        if [ -n "$drift" ]; then
          printf '==> assets: .gitignore and ASSETS_REMOTE_DIRS disagree:%b\n' "$drift" >&2
          echo "    reconcile them in .gitignore and Taskfile.yml before syncing" >&2
          exit 1
        fi

  # Assets live in GCS, one bucket prefix per entry in ASSETS_REMOTE_DIRS —
  # syncing site/assets wholesale would push (and, coming back down, overwrite)
  # the version-controlled sources that share that tree. `gcloud storage rsync`
  # is additive by default (no deletes unless asked) and supports a dry run.
  # Auth is ambient: the tasks use whatever gcloud account is active, so the same
  # command works interactively (after `gcloud auth login`) and in CI (after
  # `gcloud auth activate-service-account --key-file=...`, or a Workload
  # Identity Federation step). The precondition fails fast if neither is set up.
  "assets:sync:up*":
    desc: "sync assets up to cloud storage (use :up:hard to bypass dry run)"
    deps: ["assets:sync:_check"]
    vars:
      q: "{{index .MATCH 0}}"
    preconditions:
      - sh: gcloud auth list --filter=status:ACTIVE --format="value(account)" | grep -q .
        msg: "no active gcloud account; run 'gcloud auth login' or 'gcloud auth activate-service-account --key-file=...'"
    cmds:
      - |-
        for dir in {{.ASSETS_REMOTE_DIRS}}; do
          local_dir="{{.ASSETS_LOCAL_PATH}}/$dir"
          if [ ! -d "$local_dir" ]; then
            echo "==> assets:sync:up: skipping $dir (nothing local to push)"
            continue
          fi
          echo "==> assets:sync:up: $dir"
          gcloud storage rsync --recursive {{if ne .q ":hard"}}--dry-run{{ end }} \
            "$local_dir" "{{.ASSETS_REMOTE_PATH}}/$dir"
        done

  # A tree absent from the bucket is skipped rather than treated as an error, but
  # that decision comes from one listing of the bucket root: probing each prefix
  # separately would report an expired token or a network blip as "not in the
  # bucket" and exit 0 having downloaded nothing.
  "assets:sync:down*":
    desc: "sync assets down to local environment (use :down:hard to bypass dry run)"
    deps: ["assets:sync:_check"]
    vars:
      q: "{{index .MATCH 0}}"
    preconditions:
      - sh: gcloud auth list --filter=status:ACTIVE --format="value(account)" | grep -q .
        msg: "no active gcloud account; run 'gcloud auth login' or 'gcloud auth activate-service-account --key-file=...'"
    cmds:
      - |-
        if ! bucket_root="$(gcloud storage ls "{{.ASSETS_REMOTE_PATH}}/")"; then
          echo "==> assets:sync:down: cannot list {{.ASSETS_REMOTE_PATH}}" >&2
          exit 1
        fi
        for dir in {{.ASSETS_REMOTE_DIRS}}; do
          remote_dir="{{.ASSETS_REMOTE_PATH}}/$dir"
          case "$bucket_root" in
            *"$remote_dir/"*) ;;
            *)
              echo "==> assets:sync:down: skipping $dir (not in the bucket)"
              continue
              ;;
          esac
          echo "==> assets:sync:down: $dir"
          mkdir -p "{{.ASSETS_LOCAL_PATH}}/$dir"
          gcloud storage rsync --recursive {{if ne .q ":hard"}}--dry-run{{ end }} \
            "$remote_dir" "{{.ASSETS_LOCAL_PATH}}/$dir"
        done

  # The up-sync used to mirror all of site/assets, so the bucket still holds
  # source trees the site never fetches from it. This removes everything at the
  # bucket root outside ASSETS_REMOTE_DIRS. `gcloud storage rm` has no dry run of
  # its own, so this task reports what it would delete and deletes nothing until
  # :hard.
  "assets:sync:prune*":
    desc: "delete bucket entries outside the synced asset trees (use :prune:hard to bypass dry run)"
    deps: ["assets:sync:_check"]
    vars:
      q: "{{index .MATCH 0}}"
    preconditions:
      - sh: gcloud auth list --filter=status:ACTIVE --format="value(account)" | grep -q .
        msg: "no active gcloud account; run 'gcloud auth login' or 'gcloud auth activate-service-account --key-file=...'"
    cmds:
      - |-
        if ! bucket_root="$(gcloud storage ls "{{.ASSETS_REMOTE_PATH}}/")"; then
          echo "==> assets:sync:prune: cannot list {{.ASSETS_REMOTE_PATH}}" >&2
          exit 1
        fi
        echo "==> assets:sync:prune: keeping {{.ASSETS_REMOTE_DIRS}}"
        while IFS= read -r entry; do
          [ -n "$entry" ] || continue
          name="${entry#{{.ASSETS_REMOTE_PATH}}/}"
          case " {{.ASSETS_REMOTE_DIRS}} " in
            *" ${name%/} "*) continue ;;
          esac
          if [ "{{.q}}" != ":hard" ]; then
            echo "    would remove $entry"
            continue
          fi
          echo "    removing $entry"
          case "$entry" in
            */) gcloud storage rm --recursive "$entry" ;;
            *)  gcloud storage rm "$entry" ;;
          esac
        done <<BUCKET_ROOT
        $bucket_root
        BUCKET_ROOT

  # Webfonts are served from the bucket but, unlike <img>, fonts are always
  # fetched in CORS mode, so the bucket must send Access-Control-Allow-Origin.
  # Re-run after (re)creating the bucket. Auth is ambient, like the sync tasks.
  "assets:cors:sync:up":
    desc: "sync CORS config up to the assets bucket so cross-origin webfonts load"
    preconditions:
      - sh: gcloud auth list --filter=status:ACTIVE --format="value(account)" | grep -q .
        msg: "no active gcloud account; run 'gcloud auth login' or 'gcloud auth activate-service-account --key-file=...'"
    cmds:
      - gcloud storage buckets update {{.ASSETS_REMOTE_PATH}} --cors-file={{.PROJECT_ROOT}}/config/gcs-cors.json

  serve:
    desc: "alias for serve:dev (the common case)"
    cmds:
      - task: serve:dev

  serve:dev:
    desc: "serve locally in development mode — images from disk, live reload (DRAFTS=1 to include drafts)"
    cmds:
      - task: serve:_run
        vars: { HUGO_ENV: development }

  serve:prod:
    desc: "serve locally in production mode — images from the GCS bucket; mirrors the Netlify build"
    cmds:
      - task: serve:_run
        vars: { HUGO_ENV: production }

  # Shared serve implementation. The dev/prod split is the Hugo environment and
  # nothing else: layouts key off `hugo.IsProduction` to choose disk vs. bucket
  # assets and dev vs. minified CSS, so the same `hugo server` invocation
  # faithfully previews either target (prod even live-reloads). Pass DRAFTS=1 to
  # include draft content.
  serve:_run:
    internal: true
    deps: [clean, "assets:fonts:download"]
    requires:
      vars: [HUGO_ENV]
    vars:
      DRAFTS: '{{.DRAFTS | default ""}}'
    cmds:
      - |-
        hugo server \
          --source {{.SOURCE_PATH}} \
          --destination {{.OUTPUT_PATH}} \
          --environment {{.HUGO_ENV}} \
          {{if .DRAFTS}}--buildDrafts{{ end }}

  # BASE_URL overrides the baseURL in the Hugo config. The Netlify build passes
  # the address that serves the deploy (see deploy.sh), which differs per
  # context — production, deploy preview, branch deploy. Local builds leave it
  # empty and keep the configured baseURL.
  build:
    desc: "build the website and save it (BASE_URL=... overrides the configured baseURL)"
    deps: [clean, "assets:fonts:download"]
    vars:
      BASE_URL: '{{.BASE_URL | default ""}}'
    cmds:
      - |-
        hugo \
          --source {{.SOURCE_PATH}} \
          --destination {{.OUTPUT_PATH}} \
          {{if .BASE_URL}}--baseURL "{{.BASE_URL}}"{{ end }}
      - task: build:remove-unused-theme-elements

  # Everything the deploy depends on that a build cannot notice on its own: a
  # wrong base URL still builds, and a publish directory that no longer matches
  # OUTPUT_PATH only fails on Netlify, after the push. `deploy.sh` runs this
  # before it builds, so a deploy fails on the drift rather than on its effect.
  check:deploy:
    desc: "check the deploy wiring: base URL per Netlify context, publish directory"
    cmds:
      - |-
        fail=""
        check() {
          [ "$2" = "$3" ] || fail="$(printf '%s\n    %s: want [%s], got [%s]' "$fail" "$1" "$2" "$3")"
        }

        # deploy.sh maps the Netlify context to the address that serves the deploy.
        check "production build" "https://site.test" \
          "$(CONTEXT=production URL=https://site.test DEPLOY_PRIME_URL=https://preview.test {{.PROJECT_ROOT}}/deploy.sh --base-url)"
        check "preview build" "https://preview.test" \
          "$(CONTEXT=deploy-preview URL=https://site.test DEPLOY_PRIME_URL=https://preview.test {{.PROJECT_ROOT}}/deploy.sh --base-url)"
        # Cleared rather than inherited: on Netlify these are always set, and
        # this case is the build that runs where they are not.
        check "build outside Netlify" "" \
          "$(CONTEXT= URL= DEPLOY_PRIME_URL= {{.PROJECT_ROOT}}/deploy.sh --base-url)"

        # `build` turns that address into hugo's --baseURL, and passes none without it.
        case "$(task --dry build BASE_URL=https://preview.test 2>&1)" in
          *'--baseURL "https://preview.test"'*) ;;
          *) fail="$(printf '%s\n    build BASE_URL=...: no --baseURL in the hugo command' "$fail")" ;;
        esac
        case "$(task --dry build 2>&1)" in
          *--baseURL*) fail="$(printf '%s\n    build: --baseURL passed without a BASE_URL' "$fail")" ;;
        esac

        # Netlify publishes the directory the build writes to.
        publish="$(sed -n 's/^ *publish *= *"\(.*\)" *$/\1/p' {{.PROJECT_ROOT}}/netlify.toml)"
        check "netlify.toml publish" "$(basename {{.OUTPUT_PATH}})" "$publish"

        if [ -n "$fail" ]; then
          printf '==> check:deploy: the deploy wiring disagrees with itself:%s\n' "$fail" >&2
          exit 1
        fi
        echo "==> check:deploy: base URL per context and publish directory agree"

  build:remove-unused-theme-elements:
    desc: "remove theme-provided assets this site doesn't use from the build output"
    cmds:
      - |-
        # The hugo-coder theme ships Font Awesome web fonts in its static/
        # directory, so Hugo copies them into the build output even though this
        # site imports no Font Awesome stylesheet and renders no FA icons (we
        # use inline Lucide SVGs instead). Strip the unused fonts so they are
        # never published.
        echo "==> build:remove-unused-theme-elements: removing unused Font Awesome fonts from {{.OUTPUT_PATH}}/fonts"
        fa_fonts=$(find {{.OUTPUT_PATH}}/fonts -maxdepth 1 -name 'fa-*' 2>/dev/null | sort)
        if [ -z "$fa_fonts" ]; then
          echo "    nothing to remove (output already free of Font Awesome fonts)"
        else
          echo "$fa_fonts" | while IFS= read -r f; do
            echo "    removing $(basename "$f") ($(du -h "$f" | cut -f1))"
            rm -f "$f"
          done
          echo "==> build:remove-unused-theme-elements: done"
        fi

  refresh-theme:
    desc: "update hugo-coder fork to latest upstream"
    dir: "{{.SOURCE_PATH}}/themes/hugo-coder"
    cmds:
      - git fetch upstream
      - git merge upstream/main
      - git push origin main

  new-post:
    desc: "add a new post (with ITEM_NAME=...)"
    preconditions:
      # Don't proceed if the name is blank.
      - test -n "$ITEM_NAME"
    cmds:
      - mkdir -p {{.CONTENT_PATH}}
      - |-
        hugo new content --logLevel info -k posts {{.ITEM_NAME}}.md \
          --source {{.PROJECT_ROOT}}/site
