baseURL: "https://jxf-dot-me.netlify.app/"
locale: "en-us"
title: "{ jxf }"

theme: "hugo-coder"

# Hugo's built-in media type table covers font/ttf and font/otf but not the
# woff formats, so build-time fetches of webfonts (an experiment manifest's
# `fonts:` section) can't resolve their media type without these entries.
mediaTypes:
  "font/woff2":
    suffixes: ["woff2"]
  "font/woff":
    suffixes: ["woff"]

taxonomies:
  tag: "tags"
  category: "categories"
  author: "authors"
  series: "series"

markup:
  goldmark:
    parser:
      # Allow Markdown attributes (e.g. {.half-width}) on block elements, and
      # emit standalone images directly so the image render hook can wrap them
      # in a <figure> instead of a <p>.
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["$$", "$$"]
            - ["\\[", "\\]"]
          inline:
            - ["$", "$"]
            - ["\\(", "\\)"]
